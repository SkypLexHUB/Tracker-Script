<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Script Execution Logger</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Highlight.js สำหรับจัดสีโค้ด Luau/Lua -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/lua.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-mono">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center px-6">
    <div class="flex items-center space-x-3">
      <span class="relative flex h-3 w-3">
        <span id="status-ping" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
        <span id="status-dot" class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
      </span>
      <h1 class="text-lg font-bold tracking-wider text-emerald-400">⚡ ROBLOX SCRIPT LOGGER</h1>
    </div>
    <div class="flex items-center space-x-2">
      <button onclick="clearLogs()" class="bg-red-950 hover:bg-red-900 text-red-300 text-xs px-3 py-1.5 rounded border border-red-800 transition">Clear Logs</button>
    </div>
  </header>

  <!-- Main Container -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- Sidebar / Filters -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 p-4 flex flex-col gap-4">
      <div>
        <label class="text-xs text-slate-400 uppercase tracking-wider font-semibold block mb-2">Filter Type</label>
        <div class="space-y-1">
          <button onclick="setFilter('ALL')" class="w-full text-left px-3 py-1.5 rounded text-xs bg-slate-800 hover:bg-slate-700 font-medium">ALL LOGS</button>
          <button onclick="setFilter('EXEC')" class="w-full text-left px-3 py-1.5 rounded text-xs hover:bg-slate-800 text-emerald-400">FUNCTIONS</button>
          <button onclick="setFilter('REMOTE')" class="w-full text-left px-3 py-1.5 rounded text-xs hover:bg-slate-800 text-purple-400">REMOTES</button>
          <button onclick="setFilter('PRINT')" class="w-full text-left px-3 py-1.5 rounded text-xs hover:bg-slate-800 text-sky-400">PRINTS / WARNS</button>
        </div>
      </div>

      <div class="mt-auto bg-slate-950 p-3 rounded border border-slate-800 text-xs">
        <span class="text-slate-400 block mb-1">Total Interceptions:</span>
        <span id="log-count" class="text-xl font-bold text-emerald-400">0</span>
      </div>
    </aside>

    <!-- Log Stream Area -->
    <main class="flex-1 bg-slate-950 p-6 overflow-y-auto space-y-4" id="log-container">
      <div id="empty-state" class="text-center text-slate-600 py-20">
        <p class="text-sm">Waiting for Roblox script executions...</p>
      </div>
    </main>

  </div>

  <script>
    let currentFilter = 'ALL';
    let logs = [];

    // WebSocket Connection
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${window.location.host}`);

    ws.onopen = () => {
      document.getElementById('status-dot').className = 'relative inline-flex rounded-full h-3 w-3 bg-emerald-500';
      document.getElementById('status-ping').className = 'animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75';
    };

    ws.onclose = () => {
      document.getElementById('status-dot').className = 'relative inline-flex rounded-full h-3 w-3 bg-red-500';
      document.getElementById('status-ping').className = 'hidden';
    };

    ws.onmessage = (event) => {
      const log = JSON.parse(event.data);
      logs.unshift(log);
      renderLogs();
    };

    function setFilter(type) {
      currentFilter = type;
      renderLogs();
    }

    function clearLogs() {
      logs = [];
      renderLogs();
    }

    function renderLogs() {
      const container = document.getElementById('log-container');
      const filtered = currentFilter === 'ALL' ? logs : logs.filter(l => l.type === currentFilter);
      
      document.getElementById('log-count').innerText = logs.length;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center text-slate-600 py-20"><p class="text-sm">No logs match filter "${currentFilter}"</p></div>`;
        return;
      }

      container.innerHTML = '';
      filtered.forEach(log => {
        const badgeColor = log.type === 'REMOTE' ? 'bg-purple-900 text-purple-300 border-purple-700' : 
                           log.type === 'PRINT' ? 'bg-sky-900 text-sky-300 border-sky-700' : 
                           'bg-emerald-900 text-emerald-300 border-emerald-700';

        const card = document.createElement('div');
        card.className = 'bg-slate-900 rounded-lg border border-slate-800 overflow-hidden shadow-lg';
        card.innerHTML = `
          <div class="bg-slate-800/60 px-4 py-2 border-b border-slate-800 flex justify-between items-center text-xs">
            <div class="flex items-center space-x-2">
              <span class="px-2 py-0.5 rounded border text-[10px] font-bold ${badgeColor}">${log.type}</span>
              <span class="text-slate-200 font-semibold">${log.functionName}</span>
            </div>
            <span class="text-slate-500">${log.timestamp}</span>
          </div>
          <div class="p-4">
            <pre class="rounded bg-slate-950 p-3 text-xs overflow-x-auto"><code class="language-lua">${escapeHtml(log.codeSnippet)}</code></pre>
            ${Object.keys(log.details).length ? `
              <div class="mt-2 pt-2 border-t border-slate-800/50 text-[11px] text-slate-400">
                <span class="font-bold text-slate-500">Parameters/Details:</span> ${escapeHtml(JSON.stringify(log.details))}
              </div>
            ` : ''}
          </div>
        `;
        container.appendChild(card);
      });

      // Highlight syntax
      document.querySelectorAll('pre code').forEach((block) => {
        hljs.highlightElement(block);
      });
    }

    function escapeHtml(string) {
      return String(string).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
    </html>
